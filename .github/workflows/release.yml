name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        shell: pwsh
        run: ./build.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: Overskin
          path: dist/OverskinSetup.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/OverskinSetup.exe
          generate_release_notes: true

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: sh ./build-linux.sh

      - name: Self-test (on a virtual X11 screen, so the screen grab is tested too)
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -qq
          sudo -E apt-get install -y -qq --no-install-recommends xvfb libice6 libsm6 libfontconfig1 libxtst6 ffmpeg >/dev/null
          xvfb-run -a -s "-screen 0 1280x800x24" build/linux/overskin/overskin --selftest

      - uses: actions/upload-artifact@v4
        with:
          name: Overskin-Linux
          path: dist/overskin-linux-x64.tar.gz

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/overskin-linux-x64.tar.gz
