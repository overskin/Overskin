name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        shell: pwsh
        run: ./build.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: Overskin
          path: dist/OverskinSetup.exe

      # the Microsoft Store package: kept as a workflow artifact for uploading to Partner Center,
      # never attached to GitHub releases
      - name: Build Store package
        shell: pwsh
        run: ./src/Store/build-store.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: Overskin-Store
          path: dist/*.msix

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/OverskinSetup.exe
          generate_release_notes: true
